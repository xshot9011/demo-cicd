name: CI

on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]

# Required for aws-actions/configure-aws-credentials to request the OIDC token
# used to assume the IAM role (no long-lived AWS keys needed).
permissions:
  id-token: write   # assume AWS role via OIDC
  contents: write   # create/push git tags

env:
  AWS_REGION: ap-southeast-7
  # ECR (or other registry) repo to push the multi-arch image to.
  IMAGE_REPO: 398664673656.dkr.ecr.ap-southeast-7.amazonaws.com/demo-staging-cicd
  ROLE_ARN: arn:aws:iam::398664673656:role/demo-staging-gtihub-oidc

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -v

  version:
    name: Compute version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
      bump: ${{ steps.meta.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0          # need full history + tags for semver
          fetch-tags: true

      - name: Derive short SHA + semantic version
        id: meta
        run: |
          set -euo pipefail

          # --- pick the real commit + message (handle PR vs push) ------------
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            MSG="${{ github.event.pull_request.title }}"
          else
            SHA="${{ github.sha }}"
            MSG=$(git log -1 --pretty=%s)
          fi
          SHORT_SHA=$(git rev-parse --short=7 "$SHA")

          # --- decide bump from conventional-commit type ---------------------
          # feat -> minor ; chore/fix/etc -> patch ; "!" or BREAKING -> major
          MSG_LC=$(printf '%s' "$MSG" | tr '[:upper:]' '[:lower:]')
          if printf '%s' "$MSG" | grep -qE '^[a-z]+(\([^)]+\))?!:' \
             || printf '%s' "$MSG" | grep -q 'BREAKING CHANGE'; then
            BUMP=major
          elif printf '%s' "$MSG_LC" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi

          # --- last tag (default v0.0.0) -------------------------------------
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          VER=${LAST_TAG#v}
          MAJOR=${VER%%.*}; REST=${VER#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "message: $MSG"
          echo "bump:    $BUMP  ($LAST_TAG -> $VERSION)"
          {
            echo "short_sha=$SHORT_SHA"
            echo "version=$VERSION"
            echo "bump=$BUMP"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build multi-arch image
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (assume role via OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ needs.version.outputs.short_sha }}
            ${{ env.IMAGE_REPO }}:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag:
    name: Push git tag
    needs: [version, build]
    if: github.event_name == 'push'   # tag on merge to main, not on PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push version tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHORT_SHA: ${{ needs.version.outputs.short_sha }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping."
          else
            git tag -a "$VERSION" -m "$VERSION (${SHORT_SHA})"
            git push origin "$VERSION"
            echo "Pushed git tag $VERSION"
          fi
